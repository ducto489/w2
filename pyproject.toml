[project]
name = "draft-quant-frontier"
version = "0.1.0"
description = "Pilot benchmark for draft-side quantization in speculative decoding."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.13.0",
  "bitsandbytes>=0.49.2",
  "matplotlib>=3.10.0",
  "pandas>=2.3.0",
  "pyyaml>=5.4.1",
  "torch>=2.5,<2.6",
  "transformers>=4.45.0",
]

[project.optional-dependencies]
data = [
  "datasets>=2.20.0",
]
dev = [
  "pytest>=9.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
